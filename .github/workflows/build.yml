name: Build

on:
  push:
    # Must match I18N_BRANCH in translation.yml
    branches-ignore:
      - translation/source
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container: alpine:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare Alpine Linux
        shell: sh
        run: |
          apk add --no-cache build-base bash git python3 py3-pip cmake perl linux-headers m4
          rm /usr/lib/python3.*/EXTERNALLY-MANAGED

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Conan
        uses: conan-io/setup-conan@v1.4.0
        with:
          version: '2.34.0'
          cache_packages: true

      - name: Conan Install
        # https://github.com/conan-io/conan-center-index/issues/21150
        run: |
          conan profile detect
          echo -e '\n[platform_tool_requires]\nm4/*' >> ~/.conan2/profiles/default
          conan install . --build="*" -s compiler.cppstd=20 -s build_type=Debug \
                -c tools.build:cflags="['-static']" \
                -c tools.build:cxxflags="['-static']" \
                -c tools.build:exelinkflags="['-static']"

      - name: Build
        run: |
          cmake --preset conan-debug
          cmake --build --preset conan-debug

      - name: Package
        shell: bash
        run: |
          cd build-debug
          cpack -V -C Debug
          VERSION="$(git describe --tags --always | sed 's/[^A-Za-z0-9._-]/_/g')"
          mv *.zip "InfClassR-${VERSION}-${{ runner.os }}-${{ runner.arch }}.zip"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          path: build-debug/*.zip
          archive: false
