name: Build

on:
  push:
    # Must match I18N_BRANCH in translation.yml
    branches-ignore:
      - translation/source
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare Alpine Linux
        run: apk add --no-cache build-base

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - name: Setup Conan
        uses: conan-io/setup-conan@v1.4.0
        with:
          version: '2.34.0'
          cache_packages: true

      - name: Setup CMake
        uses: lukka/get-cmake@v4.4.2

      - name: Conan Install
        run: |
          conan install . --build=missing -s compiler.cppstd=20 -s build_type=Debug ${{ matrix.conan-args }}

      - name: Build
        run: |
          conan build . --build=missing -s compiler.cppstd=20 -s build_type=Debug ${{ matrix.conan-args }}

      - name: Package
        shell: bash
        run: |
          cd build-debug
          cpack -V -C Debug
          VERSION="$(git describe --tags --always | sed 's/[^A-Za-z0-9._-]/_/g')"
          mv *.zip "InfClassR-${VERSION}-${{ runner.os }}-${{ runner.arch }}.zip"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          path: build-debug/*.zip
          archive: false
